<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2E8D0" id="metaThemeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>อวัยวะ — Body Parts L2</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        var m = document.getElementById('metaThemeColor');
        if (m) m.setAttribute('content', '#181410');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Noto+Serif+Thai:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2E8D0;
    --ink: #1A1410;
    --ink-soft: #4A3D2E;
    --accent: #C13F1F;
    --accent-2: #1F4A3F;
    --gold: #B8923D;
    --card: #FBF6E8;
    --card-shadow: rgba(26, 20, 16, 0.18);
    --rule: rgba(26,20,16,0.15);
    --rule-soft: rgba(26,20,16,0.1);
    --rule-strong: rgba(26,20,16,0.22);
    --card-highlight: rgba(255,255,255,0.7);
  }

  :root[data-theme="dark"] {
    --bg: #181410;
    --ink: #F2E8D0;
    --ink-soft: #B5A689;
    --accent: #E5704C;
    --accent-2: #7AB8A4;
    --gold: #D4AF5C;
    --card: #251E18;
    --card-shadow: rgba(0, 0, 0, 0.55);
    --rule: rgba(242,232,208,0.13);
    --rule-soft: rgba(242,232,208,0.08);
    --rule-strong: rgba(242,232,208,0.22);
    --card-highlight: rgba(255,255,255,0.04);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(193,63,31,0.06) 0%, transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(31,74,63,0.07) 0%, transparent 45%);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none; -webkit-user-select: none;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  :root[data-theme="dark"] body::before {
    opacity: 0.12;
    mix-blend-mode: overlay;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.07;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px 18px 56px;
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 4px;
  }

  .title { display: flex; flex-direction: column; gap: 2px; }

  .title .thai {
    font-family: 'Noto Serif Thai', serif;
    font-weight: 800;
    font-size: 26px;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .title .en {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    background: rgba(184,146,61,0.18);
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid rgba(184,146,61,0.4);
  }

  .card-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1500px;
    padding: 10px 0;
    min-height: 0;
  }

  .card {
    width: 100%;
    aspect-ratio: 3/4;
    max-height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
    touch-action: manipulation;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border-radius: 14px;
    box-shadow:
      0 1px 0 var(--card-highlight) inset,
      0 24px 40px -16px var(--card-shadow),
      0 2px 6px var(--card-shadow);
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color 0.35s ease, box-shadow 0.35s ease;
  }
  .face.back {
    transform: rotateY(180deg);
    padding: 24px 22px;
    justify-content: space-between;
  }

  /* gold corner brackets */
  .face::before, .face::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border: 1.5px solid var(--gold);
    opacity: 0.65;
  }
  .face::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .face::after  { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .badge {
    align-self: flex-start;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-left: 22px;
    position: relative;
    margin-bottom: 4px;
  }
  .badge::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 16px; height: 1px;
    background: var(--ink-soft);
  }
  .face.back .badge {
    font-family: 'Noto Serif Thai', serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--accent);
  }
  .face.back .badge::before { background: var(--accent); }

  .figure-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 4px 0 0;
  }
  .figure {
    height: 100%;
    max-height: 260px;
    width: auto;
    color: var(--ink-soft);
  }

  .highlight .ring {
    fill: var(--accent);
    fill-opacity: 0.20;
    stroke: var(--accent);
    stroke-width: 0.6;
    transform-origin: center;
    transform-box: fill-box;
    animation: ping 1.8s ease-in-out infinite;
  }
  .highlight .dot {
    fill: var(--accent);
    filter: drop-shadow(0 0 1.5px rgba(193,63,31,0.6));
  }
  @keyframes ping {
    0%, 100% { transform: scale(0.85); fill-opacity: 0.22; stroke-opacity: 0.85; }
    50%      { transform: scale(1.15); fill-opacity: 0.40; stroke-opacity: 1; }
  }
  .highlight { animation: fadeIn 0.45s ease 0.1s both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .word-front {
    text-align: center;
    padding: 6px 8px 0;
  }
  .word-en {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-variation-settings: "opsz" 144;
    font-size: clamp(32px, 9vw, 52px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .word-en.thai-mode {
    font-family: 'Noto Serif Thai', serif;
    font-weight: 800;
    color: var(--accent);
    font-size: clamp(46px, 13vw, 72px);
    line-height: 1.1;
  }
  .word-front-rom {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(13px, 3.4vw, 16px);
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-top: 8px;
    opacity: 0;
    height: 0;
    transition: opacity 0.2s ease;
  }
  .word-front-rom.visible { opacity: 0.85; height: auto; }

  /* Back face */
  .word-back { text-align: center; margin: auto 0; padding: 0 8px; }
  .word-thai {
    font-family: 'Noto Serif Thai', serif;
    font-weight: 800;
    font-size: clamp(56px, 17vw, 100px);
    line-height: 1.1;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .word-rom {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(40px, 12vw, 68px);
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .word-en-small {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(14px, 4vw, 18px);
    color: var(--ink-soft);
  }

  .hint {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.55;
    margin-top: 6px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: none; cursor: pointer;
    padding: 16px 18px;
    border-radius: 10px;
    transition: transform 0.12s ease, background 0.15s ease;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.96); }

  .btn-next {
    flex: 1;
    background: var(--ink);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 500;
  }
  .btn-next:active { background: var(--accent); }

  .btn-flip {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--rule-strong);
    width: 56px; padding: 0;
    font-size: 18px;
  }
  .btn-flip:active { background: rgba(184,146,61,0.18); }

  .top-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 2px;
    margin-bottom: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.85;
  }
  .direction-toggle, .theme-toggle {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
    padding: 4px 6px; margin: -4px -6px;
    border-radius: 4px;
  }
  .direction-toggle:active { background: rgba(31,74,63,0.1); }
  .direction-toggle .mode { color: var(--accent-2); font-weight: 500; }
  .theme-toggle:active { background: rgba(184,146,61,0.18); }
  .theme-toggle .theme-icon {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: linear-gradient(90deg, var(--ink) 50%, transparent 50%);
    border: 1px solid var(--ink-soft);
    transition: transform 0.35s ease;
  }
  :root[data-theme="dark"] .theme-toggle .theme-icon { transform: rotate(180deg); }
  .theme-toggle .label { color: var(--gold); font-weight: 500; }

  @keyframes cardEnter {
    0%   { opacity: 0; transform: translateX(44px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes cardExit {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(-44px); }
  }
  @keyframes cardExitFlipped {
    0%   { opacity: 1; transform: translateX(0) rotateY(180deg); }
    100% { opacity: 0; transform: translateX(-44px) rotateY(180deg); }
  }
  .card.enter { animation: cardEnter 0.32s cubic-bezier(0.2, 0, 0, 1) both; }
  .card.exit { animation: cardExit 0.22s cubic-bezier(0.5, 0, 1, 1) both; pointer-events: none; }
  .card.exit.flipped { animation: cardExitFlipped 0.22s cubic-bezier(0.5, 0, 1, 1) both; pointer-events: none; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <span class="thai">อวัยวะ</span>
        <span class="en">Body Parts • รัก ไทย L2</span>
      </div>
      <div class="counter" id="counter">01 / 21</div>
    </header>

    <div class="top-controls">
      <span class="theme-toggle" id="themeToggle" role="button" aria-label="Toggle theme">
        <span class="theme-icon" aria-hidden="true"></span>
        <span class="label" id="themeLabel">Light</span>
      </span>
      <span class="direction-toggle" id="dirToggle">Mode: <span class="mode" id="modeLabel">EN → TH</span></span>
    </div>

    <div class="card-stage">
      <div class="card" id="card">
        <!-- FRONT -->
        <div class="face front">
          <span class="badge" id="frontBadge">English</span>

          <div class="figure-wrap">
            <svg class="figure" id="figure" viewBox="0 0 100 145" xmlns="http://www.w3.org/2000/svg">
              <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <!-- Head -->
                <ellipse cx="50" cy="20" rx="11" ry="13"/>
                <!-- Eyebrows -->
                <path d="M 42.5 16.5 Q 45 15.5 47.5 16.5" stroke-width="0.9"/>
                <path d="M 52.5 16.5 Q 55 15.5 57.5 16.5" stroke-width="0.9"/>
                <!-- Eyes -->
                <circle cx="45" cy="20" r="0.8" fill="currentColor" stroke="none"/>
                <circle cx="55" cy="20" r="0.8" fill="currentColor" stroke="none"/>
                <!-- Nose -->
                <path d="M 50 22 L 48.5 26 L 51.5 26" stroke-width="0.9"/>
                <!-- Mouth -->
                <path d="M 47 29 Q 50 30.5 53 29" stroke-width="0.9"/>
                <!-- Ear hints -->
                <path d="M 39 21 Q 38 22 38.5 24" stroke-width="0.9"/>
                <path d="M 61 21 Q 62 22 61.5 24" stroke-width="0.9"/>

                <!-- Neck -->
                <path d="M 46 32.5 L 46 38"/>
                <path d="M 54 32.5 L 54 38"/>

                <!-- Shoulders / torso -->
                <path d="M 46 38 Q 38 39 34 43 Q 31 47 31 53 L 33 78 Q 34 84 38 87 L 40 89"/>
                <path d="M 54 38 Q 62 39 66 43 Q 69 47 69 53 L 67 78 Q 66 84 62 87 L 60 89"/>
                <path d="M 40 89 L 60 89"/>

                <!-- Arms -->
                <path d="M 34 43 Q 29 54 26 66 Q 24 76 24 83"/>
                <path d="M 66 43 Q 71 54 74 66 Q 76 76 76 83"/>

                <!-- Hands -->
                <ellipse cx="24" cy="87" rx="3" ry="4"/>
                <ellipse cx="76" cy="87" rx="3" ry="4"/>
                <!-- Fingers -->
                <path d="M 22 90 V 92.5 M 24 91 V 93 M 26 90 V 92.5" stroke-width="0.7"/>
                <path d="M 74 90 V 92.5 M 76 91 V 93 M 78 90 V 92.5" stroke-width="0.7"/>

                <!-- Legs -->
                <path d="M 40 89 Q 39 102 39 116 Q 39 126 40 134"/>
                <path d="M 60 89 Q 61 102 61 116 Q 61 126 60 134"/>
                <path d="M 50 89 V 134"/>

                <!-- Feet -->
                <path d="M 40 134 Q 35 134 35 138 L 48 138 L 48 134"/>
                <path d="M 60 134 Q 65 134 65 138 L 52 138 L 52 134"/>
              </g>

              <!-- Dynamic highlight -->
              <g class="highlight" id="highlight">
                <ellipse class="ring" cx="50" cy="50" rx="3" ry="3"/>
                <circle class="dot" cx="50" cy="50" r="1.2"/>
              </g>
            </svg>
          </div>

          <div class="word-front">
            <div class="word-en" id="frontWord">eye</div>
            <div class="word-front-rom" id="frontRom"></div>
          </div>

          <div class="hint">tap to reveal ↻</div>
        </div>

        <!-- BACK -->
        <div class="face back">
          <span class="badge" id="backBadge">ภาษาไทย</span>
          <div class="word-back">
            <div class="word-thai" id="backThai">ตา</div>
            <div class="word-rom" id="backRom">taa</div>
            <div class="word-en-small" id="backEn">eye</div>
          </div>
          <div class="hint">→ next</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-flip" id="flipBtn" aria-label="flip card">↻</button>
      <button class="btn-next" id="nextBtn">
        <span>Next</span>
        <span>→</span>
      </button>
    </div>

  </div>

<script>
  // ครู Sarawut's L2 whiteboard set — exact romanization (c, ɯ, w, y, k system)
  const WORDS = [
    { en: "eye",         th: "ตา",       rom: "tāa" },
    { en: "ear",         th: "หู",       rom: "hǔu" },
    { en: "mouth",       th: "ปาก",      rom: "pàak" },
    { en: "nose",        th: "จมูก",     rom: "càmùuk" },
    { en: "foot",        th: "เท้า",      rom: "tháaw" },
    { en: "arm",         th: "แขน",      rom: "khɛ̌ɛn" },
    { en: "leg",         th: "ขา",       rom: "khǎa" },
    { en: "head",        th: "หัว",      rom: "hǔa" },
    { en: "eyebrow",     th: "คิ้ว",      rom: "khíw" },
    { en: "eyelash",     th: "ขนตา",     rom: "khǒntāa" },
    { en: "tooth",       th: "ฟัน",       rom: "fān" },
    { en: "tongue",      th: "ลิ้น",      rom: "lín" },
    { en: "face",        th: "หน้า",     rom: "nâa" },
    { en: "neck",        th: "คอ",       rom: "khɔ̄ɔ" },
    { en: "shoulder",    th: "ไหล่",     rom: "lày" },
    { en: "hand",        th: "มือ",       rom: "mʉ̄ʉ" },
    { en: "finger",      th: "นิ้วมือ",   rom: "níwmʉ̄ʉ" },
    { en: "fingernail",  th: "เล็บมือ",   rom: "lépmʉ̄ʉ" },
    { en: "stomach",     th: "ท้อง",      rom: "thɔ́ɔŋ" },
    { en: "knee",        th: "เข่า",      rom: "khàw" },
    { en: "elbow",       th: "ศอก",      rom: "sɔ̀ɔk" }
  ];

  // Anatomical highlight positions on the figure (viewBox 100 x 145)
  const HIGHLIGHTS = {
    "eye":        { cx: 45,   cy: 20,    rx: 2,    ry: 1.4 },
    "ear":        { cx: 38.5, cy: 22.5,  rx: 1.8,  ry: 2.2 },
    "mouth":      { cx: 50,   cy: 29,    rx: 3.2,  ry: 1.6 },
    "nose":       { cx: 50,   cy: 24.5,  rx: 1.5,  ry: 2 },
    "foot":       { cx: 40,   cy: 136,   rx: 7,    ry: 3 },
    "arm":        { cx: 28,   cy: 60,    rx: 3.5,  ry: 11 },
    "leg":        { cx: 40,   cy: 110,   rx: 3.5,  ry: 18 },
    "head":       { cx: 50,   cy: 20,    rx: 12,   ry: 14 },
    "eyebrow":    { cx: 45,   cy: 16.3,  rx: 2.5,  ry: 1 },
    "eyelash":    { cx: 45,   cy: 18.7,  rx: 2.5,  ry: 0.8 },
    "tooth":      { cx: 50,   cy: 29,    rx: 2,    ry: 1.2 },
    "tongue":     { cx: 50,   cy: 30,    rx: 2,    ry: 1.5 },
    "face":       { cx: 50,   cy: 23,    rx: 9.5,  ry: 11 },
    "neck":       { cx: 50,   cy: 36,    rx: 4,    ry: 2.5 },
    "shoulder":   { cx: 36,   cy: 41.5,  rx: 3,    ry: 2.5 },
    "hand":       { cx: 24,   cy: 87,    rx: 4,    ry: 5 },
    "finger":     { cx: 24,   cy: 91.5,  rx: 3,    ry: 2 },
    "fingernail": { cx: 24,   cy: 93,    rx: 3,    ry: 1 },
    "stomach":    { cx: 50,   cy: 70,    rx: 8,    ry: 7 },
    "knee":       { cx: 40,   cy: 110,   rx: 3.5,  ry: 2.5 },
    "elbow":      { cx: 26,   cy: 64,    rx: 2.5,  ry: 2.5 }
  };

  const card       = document.getElementById('card');
  const counter    = document.getElementById('counter');
  const frontBadge = document.getElementById('frontBadge');
  const backBadge  = document.getElementById('backBadge');
  const frontWord  = document.getElementById('frontWord');
  const frontRom   = document.getElementById('frontRom');
  const backThai   = document.getElementById('backThai');
  const backRom    = document.getElementById('backRom');
  const backEn     = document.getElementById('backEn');
  const nextBtn    = document.getElementById('nextBtn');
  const flipBtn    = document.getElementById('flipBtn');
  const dirToggle  = document.getElementById('dirToggle');
  const modeLabel  = document.getElementById('modeLabel');
  const themeToggle = document.getElementById('themeToggle');
  const themeLabel  = document.getElementById('themeLabel');
  const metaThemeColor = document.getElementById('metaThemeColor');
  const ring       = document.querySelector('#highlight .ring');
  const dot        = document.querySelector('#highlight .dot');

  let queue = [];
  let index = 0;
  let direction = 'en2th';
  let current = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function reshuffle() {
    queue = shuffle(WORDS);
    if (current && queue[0] && queue[0].en === current.en && queue.length > 1) {
      [queue[0], queue[1]] = [queue[1], queue[0]];
    }
    index = 0;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function setHighlight(word) {
    const h = HIGHLIGHTS[word.en];
    if (!h) return;
    ring.setAttribute('cx', h.cx);
    ring.setAttribute('cy', h.cy);
    ring.setAttribute('rx', h.rx);
    ring.setAttribute('ry', h.ry);
    const isLarge = h.rx > 5 || h.ry > 5;
    if (isLarge) {
      dot.style.display = 'none';
    } else {
      dot.style.display = '';
      dot.setAttribute('cx', h.cx);
      dot.setAttribute('cy', h.cy);
      dot.setAttribute('r', Math.min(Math.min(h.rx, h.ry) * 0.55, 1.4));
    }
    // re-trigger fadeIn animation
    const group = document.getElementById('highlight');
    group.style.animation = 'none';
    void group.offsetWidth;
    group.style.animation = '';
  }

  function render() {
    if (index >= queue.length) reshuffle();
    current = queue[index];

    if (direction === 'en2th') {
      frontBadge.textContent = 'English';
      backBadge.textContent  = 'ภาษาไทย';
      frontWord.textContent  = current.en;
      frontWord.classList.remove('thai-mode');
      frontRom.textContent   = '';
      frontRom.classList.remove('visible');
      backThai.textContent   = current.th;
      backRom.textContent    = current.rom;
      backEn.textContent     = current.en;
      backThai.style = '';
      backEn.style   = '';
    } else {
      frontBadge.textContent = 'ภาษาไทย';
      backBadge.textContent  = 'English';
      frontWord.textContent  = current.th;
      frontWord.classList.add('thai-mode');
      frontRom.textContent   = current.rom;
      frontRom.classList.add('visible');
      backThai.textContent   = current.en;
      backThai.style.fontFamily = "'Fraunces', serif";
      backThai.style.fontWeight = '300';
      backThai.style.color = 'var(--ink)';
      backRom.textContent    = current.rom;
      backEn.textContent     = '— ' + current.th;
      backEn.style.fontFamily = "'Noto Serif Thai', serif";
      backEn.style.fontStyle  = 'normal';
    }

    setHighlight(current);
    counter.textContent = `${pad(index + 1)} / ${pad(queue.length)}`;

    card.classList.remove('flipped');
    card.classList.remove('enter');
    void card.offsetWidth;
    card.classList.add('enter');
  }

  function flip() {
    if (card.classList.contains('exit')) return;
    card.classList.toggle('flipped');
  }
  function next() {
    if (card.classList.contains('exit')) return;
    card.classList.remove('enter');
    card.classList.add('exit');
  }

  card.addEventListener('click', flip);
  flipBtn.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });

  card.addEventListener('animationend', (e) => {
    if (e.target !== card) return;
    if (e.animationName === 'cardExit' || e.animationName === 'cardExitFlipped') {
      card.classList.remove('exit');
      index++;
      render();
    } else if (e.animationName === 'cardEnter') {
      card.classList.remove('enter');
    }
  });

  dirToggle.addEventListener('click', () => {
    direction = direction === 'en2th' ? 'th2en' : 'en2th';
    modeLabel.textContent = direction === 'en2th' ? 'EN → TH' : 'TH → EN';
    current = null;
    reshuffle();
    render();
  });

  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    themeLabel.textContent = mode === 'dark' ? 'Dark' : 'Light';
    if (metaThemeColor) metaThemeColor.setAttribute('content', mode === 'dark' ? '#181410' : '#F2E8D0');
    try { localStorage.setItem('theme', mode); } catch (e) {}
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    if (e.key === 'ArrowRight' || e.key === 'n') { next(); }
  });

  reshuffle();
  render();
</script>
</body>
</html>
